<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>森林調査 音声記録 v5.1</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--text:#1f2a24;--muted:#68736d;--border:#cfd8d2;--primary:#256b45;--ok:#e5f5ea;--partial:#fff3cd;--todo:#f1f3f2;--dead:#ece6e6;--danger:#a63d40}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:820px;margin:auto;padding:14px 12px 32px} h1{font-size:23px;margin:5px 0 14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0000000a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:5px}
select,input,textarea{width:100%;font-size:19px;padding:10px;border:1px solid var(--border);border-radius:9px;background:#fff} textarea{min-height:65px}
button{border:0;border-radius:11px;padding:13px 10px;font-size:17px;font-weight:700}.primary{background:var(--primary);color:#fff}.secondary{background:#e8eeea}.danger{background:#f4e8e8;color:var(--danger)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.wide{grid-column:1/-1}
.banner{font-size:13px;line-height:1.5;padding:9px;border-radius:8px;margin-top:10px}.banner.ok{background:#e7f5eb}.banner.warn{background:#fff3cd}
.transcript{padding:10px;background:#f7faf8;border:1px dashed var(--border);border-radius:8px;min-height:48px;line-height:1.5}
.status{font-size:14px;margin-top:8px;color:var(--muted)}.status.ok{color:#176b3a;font-weight:700}.status.warn{color:#8a5b00;font-weight:700}.status.err{color:var(--danger);font-weight:700}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.summary div{padding:8px 3px;border-radius:8px;background:#f5f7f6}.summary b{display:block;font-size:21px}
.table-wrap{overflow:auto;max-height:360px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 5px;border-bottom:1px solid #e5eae7;white-space:nowrap}th{position:sticky;top:0;background:#fff;z-index:1}
tr.complete{background:var(--ok)}tr.partial{background:var(--partial)}tr.todo{background:var(--todo)}tr.dead{background:var(--dead)}
.small{font-size:12px;color:var(--muted);line-height:1.55}.hidden{display:none}
@media(max-width:540px){.grid,.actions{grid-template-columns:1fr}.wide,.full{grid-column:auto}.summary{grid-template-columns:repeat(2,1fr)}h1{font-size:20px}}
</style>
</head>
<body><div class="wrap">
<h1>🌲 森林調査 音声記録 v5.1.1</h1>

<div class="card">
 <div class="grid">
  <div><label>都道府県（試験地の絞り込み）</label><select id="prefecture"><option value="">選択してください</option></select></div>
  <div><label>試験地</label><select id="plot" disabled><option value="">先に都道府県を選択</option></select></div>
 </div>
 <div id="siteInfo" class="small" style="margin-top:8px"></div>
 <div id="env" class="banner"></div>
</div>

<div class="card">
 <label>前回の毎木データ（任意）</label>
 <input id="previousCsv" type="file" accept=".csv,text/csv">
 <div class="small" style="margin-top:7px">CSVの「樹木番号」「直径」「樹高」「コメント」を読み込みます。列名は「tree_no / dbh_cm / height_m」でも認識します。読み込んだ木は未測定一覧になります。</div>
</div>

<div class="card">
 <div class="summary">
  <div>対象木<b id="nAll">0</b></div><div>✅ 完了<b id="nDone">0</b></div>
  <div>🟡 途中<b id="nPart">0</b></div><div>⬜ 未測定<b id="nTodo">0</b></div>
 </div>
</div>

<div class="card">
 <div class="grid">
  <div><label>樹木番号</label><input id="treeNo" inputmode="numeric" placeholder="例 123"></div>
  <div><label>状態</label><select id="treeStatus"><option value="生存">生存</option><option value="枯死">枯死</option><option value="見つからない">見つからない</option></select></div>
  <div><label>今回 直径 DBH (cm)</label><input id="dbh" inputmode="decimal" placeholder="例 12.5"></div>
  <div><label>今回 樹高 (m)</label><input id="height" inputmode="decimal" placeholder="例 15.0"></div>
  <div class="full"><label>コメント</label><textarea id="comment"></textarea></div>
 </div>
 <div id="previousValues" class="banner hidden"></div>
</div>

<div class="card">
 <label>認識した音声</label><div id="transcript" class="transcript">まだ音声入力されていません。</div>
 <div id="msg" class="status">例：「番号123、直径12.5」または「番号123、樹高15」</div>
</div>

<div class="card"><div class="actions">
 <button id="voiceBtn" class="primary wide">🎤 音声入力</button>
 <button id="saveBtn" class="primary">💾 記録・更新</button><button id="redoBtn" class="secondary">↩ 入力クリア</button>
 <button id="csvBtn" class="secondary wide">⬇ 試験地CSVを出力</button>
</div></div>

<div class="card">
 <label>測定状況</label>
 <div class="small">⬜ 未測定　🟡 直径または樹高のみ　✅ 両方測定　☠ 枯死/見つからない</div>
 <div class="table-wrap"><table><thead><tr><th>状態</th><th>番号</th><th>前回径</th><th>今回径</th><th>前回高</th><th>今回高</th></tr></thead><tbody id="body"></tbody></table></div>
</div>
</div>

function setMsg(t,c=""){msg.textContent=t;msg.className="status "+c}
function normalize(s){const m={"０":"0","１":"1","２":"2","３":"3","４":"4","５":"5","６":"6","７":"7","８":"8","９":"9","．":".","。":".","，":",","、":","};return (s||"").replace(/[０-９．。，、]/g,x=>m[x]||x)}
function safeName(s){return (s||"試験地").replace(/[\\/:*?"<>|]/g,"_")}
function storageKey(){return "forest_v5_"+(plot.value||"none")}

[...new Set(MASTER.map(x=>x["都道府県"]))].sort((a,b)=>a.localeCompare(b,"ja")).forEach(x=>{let o=document.createElement("option");o.value=o.textContent=x;pref.appendChild(o)})

function parseSpeech(raw){
 let t=normalize(raw).replace(/\s+/g,"").replace(/センチメートル|センチ|メートル/g,"");
 let r={treeNo:"",dbh:"",height:"",status:"",comment:""};
 let m=t.match(/(?:樹木番号|木番号|番号|ナンバー)(\d+)/); if(m)r.treeNo=m[1];
 m=t.match(/(?:胸高直径|直径|DBH)(\d+(?:\.\d+)?)/i);if(m)r.dbh=m[1];
 m=t.match(/(?:樹高|受講|樹こう|じゅこう|ジュコウ|高さ)(\d+(?:\.\d+)?)/);if(m)r.height=m[1];
 if(/枯死|枯れ|枯れて/.test(t))r.status="枯死"; if(/見つからない|不明/.test(t))r.status="見つからない";
 m=t.match(/(?:コメント|備考)[,：:]?(.*)$/);if(m)r.comment=m[1].replace(/^,+/,"");
 const nums=t.match(/\d+(?:\.\d+)?/g)||[]; if(!r.treeNo&&nums[0])r.treeNo=nums[0].split(".")[0];
 // 3数値発話の時だけ、2番目=直径、3番目=樹高で補完。2数値だけならラベルを尊重して誤代入しない。
 if(nums.length>=3){if(!r.dbh)r.dbh=nums[1];if(!r.height)r.height=nums[2]}
 return r
}
function findRec(no){return records.find(r=>String(r.tree_no)===String(no))}
function showExisting(no){
 let r=findRec(no);prevBox.classList.remove("hidden");
 if(!r){prevBox.textContent="この樹木番号は前回データにありません。新規木として登録できます。";return}
 prevBox.innerHTML=`前回値：直径 <b>${r.prev_dbh??"―"}</b> cm ／ 樹高 <b>${r.prev_height??"―"}</b> m<br>今回値：直径 <b>${r.dbh_cm??"―"}</b> cm ／ 樹高 <b>${r.height_m??"―"}</b> m`;
}
function apply(r){
 if(r.treeNo){treeNo.value=r.treeNo;let old=findRec(r.treeNo);dbh.value=old?.dbh_cm??"";height.value=old?.height_m??"";comment.value=old?.comment??"";treeStatus.value=old?.tree_status||"生存";showExisting(r.treeNo)}
 if(r.dbh)dbh.value=r.dbh;if(r.height)height.value=r.height;if(r.status)treeStatus.value=r.status;if(r.comment)comment.value=r.comment;
 setMsg(r.treeNo?`番号 ${r.treeNo} を認識しました。既存値と今回値を確認してください。`:"樹木番号を認識できませんでした。","ok")
}
treeNo.addEventListener("change",()=>{let r=findRec(treeNo.value);if(r){dbh.value=r.dbh_cm??"";height.value=r.height_m??"";comment.value=r.comment??"";treeStatus.value=r.tree_status||"生存"}showExisting(treeNo.value)})

 if(!window.isSecureContext||location.protocol==="file:"||location.protocol==="content:"){env.className="banner warn";env.textContent="⚠ 音声入力はGitHub PagesなどのHTTPSで開いてください。";return}
 env.className="banner ok";env.textContent="✓ HTTPS接続：音声入力を利用できます。";
 if(!SR){setMsg("このブラウザは音声認識APIに対応していません。","warn");return}
 recognition=new SR();recognition.lang="ja-JP";recognition.interimResults=false;recognition.continuous=false;
 recognition.onstart=()=>{listening=true;$("voiceBtn").textContent="🎙 聞いています…"}
 recognition.onresult=e=>{let raw=e.results[0][0].transcript;transcript.textContent=raw;apply(parseSpeech(raw))}
 recognition.onerror=e=>setMsg("音声認識エラー："+e.error,"err");
 recognition.onend=()=>{listening=false;$("voiceBtn").textContent="🎤 音声入力"}
}
$("voiceBtn").onclick=async()=>{if(!recognition)return;try{if(navigator.mediaDevices?.getUserMedia){let st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(x=>x.stop())}recognition.start()}catch(e){setMsg("マイクを開始できません。サイトのマイク権限を確認してください。","err")}}

function upsert(){
 if(!plot.value)throw Error("試験地を選択してください。");
 let no=treeNo.value.trim(),d=dbh.value.trim(),h=height.value.trim();if(!/^\d+$/.test(no))throw Error("樹木番号を入力してください。");
 if(d&&!/^\d+(\.\d+)?$/.test(d))throw Error("直径を数値で入力してください。");if(h&&!/^\d+(\.\d+)?$/.test(h))throw Error("樹高を数値で入力してください。");
 let r=findRec(no);if(!r){r={tree_no:no,prev_dbh:"",prev_height:"",dbh_cm:"",height_m:"",tree_status:"生存",comment:"",measured_dbh:false,measured_height:false};records.push(r)}
 // A non-empty field entered now is treated as measured. Existing displayed value remains measured if already true.
 if(d!==""){r.dbh_cm=Number(d);r.measured_dbh=true} if(h!==""){r.height_m=Number(h);r.measured_height=true}
 r.tree_status=treeStatus.value;r.comment=comment.value.trim();r.datetime=new Date().toLocaleString("ja-JP");
 localStorage.setItem(storageKey(),JSON.stringify(records));render();clearInput();setMsg(`番号 ${no} を保存しました。`,"ok")
}
$("saveBtn").onclick=()=>{try{upsert()}catch(e){setMsg(e.message,"err")}}
function clearInput(){treeNo.value=dbh.value=height.value=comment.value="";treeStatus.value="生存";prevBox.classList.add("hidden");transcript.textContent="次の木を音声入力してください。"}
$("redoBtn").onclick=clearInput;

function state(r){if(r.tree_status!=="生存")return["☠ "+r.tree_status,"dead"];if(r.measured_dbh&&r.measured_height)return["✅ 完了","complete"];if(r.measured_dbh||r.measured_height)return["🟡 途中","partial"];return["⬜ 未測定","todo"]}
function render(){
 let body=$("body");body.innerHTML="";let done=0,part=0,todo=0;
 records.slice().sort((a,b)=>Number(a.tree_no)-Number(b.tree_no)).forEach(r=>{let [st,cl]=state(r);if(cl==="complete")done++;else if(cl==="partial")part++;else if(cl==="todo")todo++;let tr=document.createElement("tr");tr.className=cl;[st,r.tree_no,r.prev_dbh??"",r.dbh_cm??"",r.prev_height??"",r.height_m??""].forEach(v=>{let td=document.createElement("td");td.textContent=v;tr.appendChild(td)});tr.onclick=()=>{treeNo.value=r.tree_no;dbh.value=r.dbh_cm??"";height.value=r.height_m??"";comment.value=r.comment??"";treeStatus.value=r.tree_status||"生存";showExisting(r.tree_no)};body.appendChild(tr)});
 $("nAll").textContent=records.length;$("nDone").textContent=done;$("nPart").textContent=part;$("nTodo").textContent=todo;
}
function parseCSV(text){
 const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];
 function cells(line){let a=[],cur="",q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c=='"'){if(q&&line[i+1]=='"'){cur+='"';i++}else q=!q}else if(c==","&&!q){a.push(cur);cur=""}else cur+=c}a.push(cur);return a}
 let h=cells(lines[0]).map(x=>x.trim());let idx=(names)=>{for(let n of names){let i=h.indexOf(n);if(i>=0)return i}return -1};
 let ni=idx(["樹木番号","tree_no","TreeNo","番号"]),di=idx(["直径","直径_cm","dbh_cm","DBH","今回直径"]),hi=idx(["樹高","樹高_m","height_m","Height","今回樹高"]),ci=idx(["コメント","comment","備考"]);
 if(ni<0)throw Error("CSVに「樹木番号」列が見つかりません。");
 return lines.slice(1).map(line=>{let c=cells(line);return{tree_no:c[ni],prev_dbh:di>=0?c[di]:"",prev_height:hi>=0?c[hi]:"",dbh_cm:"",height_m:"",tree_status:"生存",comment:ci>=0?c[ci]:"",measured_dbh:false,measured_height:false}}).filter(r=>r.tree_no)
}
$("previousCsv").onchange=async e=>{try{if(!plot.value)throw Error("先に試験地を選択してください。");let imported=parseCSV(await e.target.files[0].text());records=imported;localStorage.setItem(storageKey(),JSON.stringify(records));render();setMsg(`前回データ ${records.length} 本を読み込みました。`,"ok")}catch(err){setMsg(err.message,"err")}}

function esc(v){let s=String(v??"");return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
$("csvBtn").onclick=()=>{if(!plot.value){setMsg("試験地を選択してください。","warn");return}let name=plot.options[plot.selectedIndex].textContent;let head=["樹木番号","前回直径","前回樹高","今回直径","今回樹高","生死","コメント","測定日時"];let rows=records.map(r=>[r.tree_no,r.prev_dbh,r.prev_height,r.dbh_cm,r.height_m,r.tree_status,r.comment,r.datetime||""]);let csv="\uFEFF"+[head,...rows].map(x=>x.map(esc).join(",")).join("\r\n");let u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));let a=document.createElement("a");a.href=u;a.download=safeName(name)+".csv";a.click();URL.revokeObjectURL(u)}
setupSpeech();render();
</script></body></html>
